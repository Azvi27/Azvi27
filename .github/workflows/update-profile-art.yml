name: Update Profile Art

on:
  schedule:
    - cron: "17 6 * * *" # Berjalan otomatis setiap hari ~06:17 UTC
  workflow_dispatch:      # Tombol trigger manual di tab Actions

permissions:
  contents: write

jobs:
  refresh-heatmap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Scrape contributions & render SVG
        run: |
          python scripts/fetch_contributions.py
          python scripts/render_heatmap_svg.py

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh contribution heatmap [skip ci]"
          file_pattern: "data/contributions.json contrib-heatmap.svg"
