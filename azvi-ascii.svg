<svg width="420" height="480" viewBox="0 0 420 480" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Stepped Terminal Reveal: Mengetik baris demi baris secara diskrit -->
    <clipPath id="terminalTypewriterClip">
      <rect x="0" y="0" width="420" height="0">
        <animate attributeName="height"
                 calcMode="discrete"
                 values="0; 12; 25; 37; 50; 62; 75; 87; 100; 112; 125; 137; 150; 162; 175; 187; 200; 212; 225; 237; 250; 262; 275; 287; 300; 312; 325; 337; 350; 362; 375; 387; 400; 480; 480; 480; 0"
                 keyTimes="0.0; 0.016; 0.033; 0.049; 0.065; 0.082; 0.098; 0.115; 0.131; 0.147; 0.164; 0.18; 0.196; 0.213; 0.229; 0.245; 0.262; 0.278; 0.295; 0.311; 0.327; 0.344; 0.36; 0.376; 0.393; 0.409; 0.425; 0.442; 0.458; 0.475; 0.491; 0.507; 0.524; 0.58; 0.92; 0.97; 1"
                 dur="7.5s"
                 repeatCount="indefinite" />
      </rect>
    </clipPath>
  </defs>

  <!-- Frame Kembar Bersih -->
  <rect width="420" height="480" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>

  <!-- Potret Lab Asli yang Tajam & Terpusat -->
  <g clip-path="url(#terminalTypewriterClip)" transform="translate(35, 48)">
    <style>
    text {
      fill: #c9d1d9;
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      font-size: 5.1px;
      white-space: pre;
      opacity: 0;
      animation: scanline 0.25s ease forwards;
    }
    @keyframes scanline {
      to {
        opacity: 1;
      }
    }
    .title {
      font-size: 12px;
      font-weight: bold;
      fill: #8b949e;
      white-space: normal;
      opacity: 1;
      animation: none;
    }
    .subtext {
      font-size: 9px;
      fill: #484f58;
      white-space: normal;
      opacity: 1;
      animation: none;
    }
  </style>

