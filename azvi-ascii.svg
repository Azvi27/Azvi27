<svg width="420" height="480" viewBox="0 0 420 480" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Stepped Terminal Typing Reveal: Diskrit turun baris demi baris, TANPA garis laser -->
    <clipPath id="asciiTypeClip">
      <rect x="0" y="0" width="420" height="0">
        <animate attributeName="height"
                 calcMode="discrete"
                 values="0; 46; 57; 69; 80; 91; 103; 114; 126; 137; 148; 160; 171; 183; 194; 205; 217; 228; 240; 251; 262; 274; 285; 296; 308; 319; 331; 342; 353; 365; 376; 388; 399; 410; 422; 433; 445; 480; 480; 0"
                 keyTimes="0; 0.043; 0.057; 0.07; 0.083; 0.097; 0.11; 0.123; 0.137; 0.15; 0.163; 0.177; 0.19; 0.203; 0.217; 0.23; 0.243; 0.257; 0.27; 0.283; 0.297; 0.31; 0.323; 0.337; 0.35; 0.363; 0.377; 0.39; 0.403; 0.417; 0.43; 0.443; 0.457; 0.47; 0.483; 0.497; 0.51; 0.55; 0.90; 1"
                 dur="7.5s"
                 repeatCount="indefinite" />
      </rect>
    </clipPath>
  </defs>

  <rect width="350" height="340" rx="8" fill="#0d1117" stroke="#21262d" stroke-width="1"/>

  <!-- Teks ASCII Utuh dengan Efek Ketikan Terminal -->
  <g clip-path="url(#asciiTypeClip)">
    <!-- Teks ASCII dengan Integritas Monospace Terjaga 100% -->
  
    <style>
    text {
      fill: #c9d1d9;
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      font-size: 5.1px;
      white-space: pre;
      opacity: 0;
      animation: scanline 0.25s ease forwards;
    }
    @keyframes scanline {
      to {
        opacity: 1;
      }
    }
    .title {
      font-size: 12px;
      font-weight: bold;
      fill: #8b949e;
      white-space: normal;
      opacity: 1;
      animation: none;
    }
    .subtext {
      font-size: 9px;
      fill: #484f58;
      white-space: normal;
      opacity: 1;
      animation: none;
    }
  </style>

