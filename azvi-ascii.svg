<svg width="490" height="340" viewBox="0 0 490 340" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="asciiTypeClip">
      <rect x="0" y="28" width="176" height="0">
        <animate attributeName="height"
                 calcMode="discrete"
                 values="0; 38; 46; 54; 62; 70; 78; 86; 94; 102; 110; 118; 126; 134; 142; 150; 158; 166; 174; 182; 190; 198; 206; 214; 222; 230; 238; 246; 254; 262; 270; 278; 286; 294; 302; 310; 318; 340; 340; 0"
                 keyTimes="0.0; 0.052; 0.064; 0.077; 0.089; 0.101; 0.113; 0.126; 0.138; 0.15; 0.162; 0.174; 0.187; 0.199; 0.211; 0.223; 0.236; 0.248; 0.26; 0.272; 0.284; 0.297; 0.309; 0.321; 0.333; 0.346; 0.358; 0.37; 0.382; 0.394; 0.407; 0.419; 0.431; 0.443; 0.456; 0.468; 0.48; 0.55; 0.92; 1.0"
                 dur="12s"
                 repeatCount="indefinite" />
      </rect>
    </clipPath>
    <linearGradient id="hudScanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0"/>
      <stop offset="30%" stop-color="#58a6ff" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#3fb950" stop-opacity="1"/>
      <stop offset="70%" stop-color="#58a6ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="hudScanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0"/>
      <stop offset="30%" stop-color="#58a6ff" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#3fb950" stop-opacity="1"/>
      <stop offset="70%" stop-color="#58a6ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="hudScanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0"/>
      <stop offset="30%" stop-color="#58a6ff" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#3fb950" stop-opacity="1"/>
      <stop offset="70%" stop-color="#58a6ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="490" height="340" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
  
  

  

  <!-- Teks ASCII dengan Integritas Monospace Terjaga 100% -->
  <g clip-path="url(#asciiTypeClip)" class="ascii-matrix">
    <style>
    .ascii-matrix text {
      fill: #c9d1d9;
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      font-size: 5.1px;
      white-space: pre;
    }
  </style>

