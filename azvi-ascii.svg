<svg width="410" height="340" viewBox="0 0 410 340" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="asciiTypeClip">
      <rect x="0" y="20" width="410" height="0">
        <animate attributeName="height"
                 calcMode="discrete"
                 values="0; 28; 36; 44; 52; 60; 69; 77; 85; 93; 101; 110; 118; 126; 134; 142; 151; 159; 167; 175; 183; 192; 200; 208; 216; 224; 233; 241; 249; 257; 265; 274; 282; 290; 298; 306; 315; 340; 340; 0"
                 keyTimes="0.0; 0.053; 0.066; 0.078; 0.091; 0.104; 0.117; 0.129; 0.142; 0.155; 0.168; 0.181; 0.193; 0.206; 0.219; 0.232; 0.244; 0.257; 0.27; 0.283; 0.296; 0.308; 0.321; 0.334; 0.347; 0.359; 0.372; 0.385; 0.398; 0.411; 0.423; 0.436; 0.449; 0.462; 0.474; 0.487; 0.5; 0.55; 0.92; 1.0"
                 dur="7.5s"
                 repeatCount="indefinite" />
      </rect>
    </clipPath>
  </defs>

  <rect width="410" height="340" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>

  <!-- Teks ASCII dengan Integritas Monospace Terjaga 100% -->
  <g clip-path="url(#asciiTypeClip)">
    <style>
    text {
      fill: #c9d1d9;
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      font-size: 5.1px;
      white-space: pre;
      opacity: 0;
      animation: scanline 0.25s ease forwards;
    }
    @keyframes scanline {
      to {
        opacity: 1;
      }
    }
    .title {
      font-size: 12px;
      font-weight: bold;
      fill: #8b949e;
      white-space: normal;
      opacity: 1;
      animation: none;
    }
    .subtext {
      font-size: 9px;
      fill: #484f58;
      white-space: normal;
      opacity: 1;
      animation: none;
    }
  </style>

