<svg width="350" height="340" viewBox="0 0 350 340" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="asciiTypeClip">
      <rect x="0" y="30" width="350" height="0">
        <animate attributeName="height"
                 values="0; 0; 300; 300; 0; 0"
                 keyTimes="0; 0.04; 0.45; 0.85; 0.92; 1"
                 dur="7s"
                 repeatCount="indefinite" />
      </rect>
    </clipPath>
  </defs>

  <rect width="350" height="340" rx="8" fill="#0d1117" stroke="#21262d" stroke-width="1"/>

  <!-- Teks ASCII dengan Integritas Monospace Terjaga 100% -->
  <g clip-path="url(#asciiTypeClip)">
    <style>
    text {
      fill: #c9d1d9;
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      font-size: 5.1px;
      white-space: pre;
      opacity: 0;
      animation: scanline 0.25s ease forwards;
    }
    @keyframes scanline {
      to {
        opacity: 1;
      }
    }
    .title {
      font-size: 12px;
      font-weight: bold;
      fill: #8b949e;
      white-space: normal;
      opacity: 1;
      animation: none;
    }
    .subtext {
      font-size: 9px;
      fill: #484f58;
      white-space: normal;
      opacity: 1;
      animation: none;
    }
  </style>

