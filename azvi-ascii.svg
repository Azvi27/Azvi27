  <!-- Frame Kembar Identik -->
  <rect width="420" height="450" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>

  <!-- Konten ASCII dengan Masking Ketikan Terminal -->
  <g clip-path="url(#terminalTypewriterClip)">
    <style>
    text {
      fill: #8b949e;
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      font-size: 7.8px;
      letter-spacing: 1.5px;
      opacity: 0;
      animation: scanline 0.25s ease forwards;
    }
    @keyframes scanline {
      to {
        opacity: 1;
      }
    }
    .title {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      font-size: 12px;
      font-weight: bold;
      fill: #8b949e;
      opacity: 1;
      animation: none;
    }
  </style>

