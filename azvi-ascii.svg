  <!-- Garis Laser Pemindai Sesuai Kodemu -->
  <g>
    <animateTransform attributeName="transform"
                      type="translate"
                      values="0 30; 0 30; 0 330; 0 330; 0 30; 0 30"
                      keyTimes="0; 0.04; 0.45; 0.85; 0.92; 1"
                      dur="7s"
                      repeatCount="indefinite" />
    <line x1="24" y1="0" x2="326" y2="0" stroke="#58a6ff" stroke-width="1.5" opacity="0.65" />
  </g>
</svg>