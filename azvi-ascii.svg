<svg width="350" height="340" viewBox="0 0 350 340" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Reveal halus vertikal: mengalir ke bawah, tampil utuh diam ~3.5 detik, lalu loop -->
    <clipPath id="asciiRevealClip">
      <rect x="0" y="20" width="350" height="0">
        <animate attributeName="height"
                 values="0; 315; 315; 0"
                 keyTimes="0; 0.45; 0.92; 1"
                 dur="7s"
                 repeatCount="indefinite" />
      </rect>
    </clipPath>
  </defs>

  <!-- Frame Kembar 350x340 -->
  <rect width="350" height="340" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>

  <!-- Konten ASCII Meja Lab (Tajam, Presisi, Tanpa Garis Laser) -->
