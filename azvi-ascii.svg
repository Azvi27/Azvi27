<svg width="420" height="450" viewBox="0 0 420 450" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    text {
      fill: #8b949e;
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      font-size: 7.8px;
      letter-spacing: 1.5px;
      opacity: 0;
      animation: scanline 0.25s ease forwards;
    }
    @keyframes scanline {
      to {
        opacity: 1;
      }
    }
    .title {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      font-size: 12px;
      font-weight: bold;
      fill: #8b949e;
      opacity: 1;
      animation: none;
    }
  </style>

  <!-- Window Frame -->
  
  <defs>
    <style>
      @keyframes terminalTypewriter {
        0% { clip-path: inset(0 100% 100% 0); }
        15% { clip-path: inset(0 0 80% 0); }
        30% { clip-path: inset(0 0 62% 0); }
        45% { clip-path: inset(0 0 45% 0); }
        60% { clip-path: inset(0 0 28% 0); }
        75% { clip-path: inset(0 0 10% 0); }
        85%, 94% { clip-path: inset(0 0 0% 0); }
        100% { clip-path: inset(0 100% 100% 0); }
      }
      .ascii-typing {
        animation: terminalTypewriter 7s steps(12, end) infinite;
      }
    </style>
  </defs>
  <rect width="420" height="450" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>

  <!-- macOS Window Controls -->
  
  
  
  

  

