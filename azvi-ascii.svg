  <rect width="420" height="480" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>

  <!-- Teks ASCII Potret Lab Meja Kerja -->
  <g clip-path="url(#asciiTypewriterClip)">
    <style>
    text {
      fill: #c9d1d9;
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      font-size: 5.1px;
      white-space: pre;
      opacity: 0;
      animation: scanline 0.25s ease forwards;
    }
    @keyframes scanline {
      to {
        opacity: 1;
      }
    }
    .title {
      font-size: 12px;
      font-weight: bold;
      fill: #8b949e;
      white-space: normal;
      opacity: 1;
      animation: none;
    }
    .subtext {
      font-size: 9px;
      fill: #484f58;
      white-space: normal;
      opacity: 1;
      animation: none;
    }
  </style>

